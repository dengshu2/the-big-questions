server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由支持 — 所有未匹配的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 打包的静态资源（文件名含 hash），设置长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 思想家星志 Markdown（可能更新，短期缓存）
    location /thinkers/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
